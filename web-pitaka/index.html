<!doctype html>
<html lang="si">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>සරල සිංහල ත්‍රිපිටකය</title>
    <meta name="description" content="සරල සිංහල ත්‍රිපිටකය: පාළි පාඨය සමඟ සරල සිංහල පරිවර්තනය. Tipitaka in simple Sinhala with the Pali text.">
    <meta property="og:type" content="article">
    <meta property="og:image" content="https://pitaka.lk/main/static/images/og.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="සරල ත්‍රිපිටකය">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#fbf8f3">
    <link rel="apple-touch-icon" href="/static/images/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="96x96" href="/static/images/favicon-96x96.png">
    <script>
      // the colour theme before first paint (src/overrides/settings.ts, web/src/composables/themes.ts)
      try {
        var t = JSON.parse(localStorage.getItem('pitaka.lk-settings-1') || '{}').theme || 'light'
        if (t === 'auto') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        if (t !== 'light') document.documentElement.className = t === 'dark' ? 'dark' : 'theme-' + t
      } catch (e) {}
    </script>
    <style>
      #ssr { max-width: 900px; margin: 56px auto 0; padding: 8px 16px; font-size: 19px; line-height: 1.4; }
      #ssr .ssr-crumbs { font-size: 14px; margin-bottom: 12px; }
      #ssr .ssr-entry { margin: 0.6em 0; text-align: justify; }
      #ssr .heading, #ssr .centered { text-align: center; }
      #ssr .heading { color: var(--c-primary); font-size: 1.3em; }
      #ssr .paragraph { text-indent: 1.4em; }
      #ssr .gatha { padding-left: 2.4em; text-align: left; }
      #ssr .editorial { opacity: .7; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
