name: ci
on:
  push:
  pull_request:
  schedule: [{ cron: '0 20 * * *' }] # nightly full corpus run

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-go@v6
        with: { go-version-file: server/go.mod, cache-dependency-path: server/go.sum }
      - run: npm ci
      - run: unzip -o -q db/dict.db.zip -x '__MACOSX/*' -d db
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:fixture
      - run: npm test
      - run: npm run test:sqlite-compat
      - run: cd server && go vet ./... && go test -race ./...
      - run: cd server && go test -run XXX -fuzz FuzzSSRPath -fuzztime 30s .
      - run: npm run build:web && npm run build:web:app && npm run check:css && npm run build:server
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npx playwright test -c e2e/playwright.config.ts
        env: { CI: 1 }
      - uses: actions/upload-artifact@v5
        if: failure()
        with: { name: playwright-report, path: e2e/playwright-report }

  # full corpus: validation (proofreaders get feedback on every push to master), tree parity with v2,
  # round trip, FTS recall and dictionary/title parity, SSR of every key
  full:
    if: github.ref == 'refs/heads/master' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-go@v6
        with: { go-version-file: server/go.mod, cache-dependency-path: server/go.sum }
      - run: npm ci
      - run: unzip -o -q db/dict.db.zip -x '__MACOSX/*' -d db
      - run: npm run build:fixture
      - run: npm run build:data
      - run: npm run test:full
      - run: cd server && FULL=1 go test -run TestSSRAllKeys ./...
      - uses: actions/upload-artifact@v5
        with: { name: build-report, path: db/build-report.md }
