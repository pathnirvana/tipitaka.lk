name: ci
# Code is tested locally before a commit (npm run check). CI validates the texts: proofreaders push their corrections to
# master, every push (and a nightly run) builds text.db, checks the corpus and renders every page.
on:
  push:
    branches: [master]
  pull_request:
  schedule: [{ cron: '0 20 * * *' }]

jobs:
  # full corpus: validation (proofreaders get feedback on every push to master), tree parity with v2,
  # round trip, FTS recall and title parity, SSR of every key
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-go@v6
        with: { go-version-file: server/go.mod, cache-dependency-path: server/go.sum }
      - run: npm ci
      - run: npm run build:data
      - run: npm run test:full
      - run: cd server && FULL=1 go test -run TestSSRAllKeys ./...
      - uses: actions/upload-artifact@v5
        if: always()
        with: { name: build-report, path: db/build-report.md }
