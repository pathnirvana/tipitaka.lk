name: release
# builds the desktop app zips natively on each OS (the server needs cgo for sqlite FTS4).
# Trigger with a v* tag or manually. (The website binary is cross compiled by scripts/deploy.sh.)
on:
  push: { tags: ['v*'] }
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-13, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-go@v6
        with: { go-version: '1.23', cache-dependency-path: server/go.sum }
      - run: npm ci
      - run: unzip -o -q db/dict.db.zip -x '__MACOSX/*' -d db
      - run: npm run build:data && npm run build:web
      - run: bash scripts/release-desktop.sh
      - uses: actions/upload-artifact@v5
        with: { name: 'desktop-${{ matrix.os }}', path: release/*.zip }
